<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026中元超薦義工報到與用餐統計系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .header-card {
      background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
      color: white;
      border-radius: 12px;
      padding: 2rem 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
    }
    .card-custom {
      border: none;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .table-container {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .badge-id {
      font-family: monospace;
      font-size: 0.9em;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
<div class="container py-4">
  <!-- 頁面標頭 -->
  <div class="header-card text-center">
    <h2 class="fw-bold mb-2">2026中元超薦義工現場報到與用餐管理系統</h2>
    <p class="mb-0 opacity-75">8/22 - 8/23 活動現場點名、用餐統計與即時狀態管理</p>
  </div>

  <!-- 狀態與搜尋選單 -->
  <div class="card card-custom mb-4">
    <div class="card-body p-4">
      <div class="row g-3">
        <div class="col-md-5">
          <label class="form-label fw-bold text-secondary">📅 選擇報到日期</label>
          <select id="dateSelect" class="form-select form-select-lg">
            <option value="8/22">8/22 (星期六)</option>
            <option value="8/23">8/23 (星期日)</option>
          </select>
        </div>
        <div class="col-md-7">
          <label class="form-label fw-bold text-secondary">🔍 關鍵字搜尋（序號或姓名）</label>
          <input type="text" id="searchInput" class="form-control form-select-lg" placeholder="輸入序號 (如 V001) 或義工姓名...">
        </div>
      </div>
    </div>
  </div>

  <!-- 組別篩選區塊 -->
  <div class="row g-3 mb-3">
    <div class="col-md-6">
      <div class="input-group">
        <span class="input-group-text bg-white fw-bold text-secondary">大組</span>
        <select id="mainGroupFilter" class="form-select">
          <option value="">-- 所有大組 --</option>
        </select>
      </div>
    </div>
    <div class="col-md-6">
      <div class="input-group">
        <span class="input-group-text bg-white fw-bold text-secondary">小組</span>
        <select id="subGroupFilter" class="form-select">
          <option value="">-- 所有小組 --</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 操作按鈕列 -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <button class="btn btn-outline-secondary" onclick="loadVolunteers()">
      🔄 手動整理資料
    </button>
    <button class="btn btn-success fw-bold" data-bs-toggle="modal" data-bs-target="#addModal">
      ➕ 現場新增義工
    </button>
  </div>

  <!-- 義工名單表格 -->
  <div class="table-responsive bg-white table-container mb-4">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th style="width: 12%;">序號</th>
          <th style="width: 18%;">姓名</th>
          <th style="width: 25%;">大組 / 小組</th>
          <th style="width: 15%;">報到狀態</th>
          <th style="width: 18%;">用餐選擇</th>
          <th style="width: 12%; text-align: center;">操作</th>
        </tr>
      </thead>
      <tbody id="volunteerList">
        <tr>
          <td colspan="6" class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
            資料載入中，請稍候...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 新增義工 Modal -->
<div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title fw-bold" id="addModalLabel">➕ 現場新增義工資料</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="addForm">
          <div class="mb-3">
            <label class="form-label fw-bold">義工姓名 <span class="text-danger">*</span></label>
            <input type="text" id="addName" class="form-control" placeholder="請輸入姓名" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">大組名稱 <span class="text-danger">*</span></label>
            <input type="text" id="addMainGroup" class="form-control" placeholder="例如：機動組" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">小組名稱 <span class="text-danger">*</span></label>
            <input type="text" id="addSubGroup" class="form-control" placeholder="例如：第一小組" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">今日用餐選擇</label>
            <select id="addMeal" class="form-select">
              <option value="便當">便當</option>
              <option value="餐券">餐券</option>
              <option value="不用餐">不用餐</option>
            </select>
          </div>
          <div class="alert alert-info py-2 small mb-0">
            ℹ️ 補登記後將自動設定為今日「已報到」狀態並寫回總表。
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-success fw-bold" onclick="submitNewVolunteer()">新增並完成報到</button>
      </div>
    </div>
  </div>
</div>

<script>
  // 🔴 請替換為您部署 Google Apps Script 後取得的 Web App URL
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwXHy8C5vCefgrSC9f9Oc7siDfkhu0ulRdLQPf3hr5XS1-IAzzz0JN9IlywMukBOCpy/exec"; 
  
  let allVolunteers = [];

  document.addEventListener("DOMContentLoaded", () => {
    loadVolunteers();
    document.getElementById("dateSelect").addEventListener("change", renderList);
    document.getElementById("searchInput").addEventListener("input", renderList);
    document.getElementById("mainGroupFilter").addEventListener("change", filterSubGroups);
    document.getElementById("subGroupFilter").addEventListener("change", renderList);
  });

  // 從 Google Apps Script 載入全量資料（僅在初始載入或點擊手動重新整理時執行）
  function loadVolunteers() {
    const tbody = document.getElementById("volunteerList");
    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="text-center py-5 text-muted">
          <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
          正在讀取最新義工資料...
        </td>
      </tr>`;

    fetch(`${GAS_URL}?action=getVolunteers`)
      .then(res => res.json())
      .then(res => {
        if(res.status === 'success') {
          allVolunteers = res.data;
          setupGroupFilters();
          renderList();
        } else {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">資料讀取失敗：${res.message || '未知錯誤'}</td></tr>`;
        }
      })
      .catch(err => {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">連線錯誤，請確認網路連線或 Apps Script URL 是否正確。</td></tr>`;
      });
  }

  function setupGroupFilters() {
    const currentMain = document.getElementById("mainGroupFilter").value;
    const mainGroups = [...new Set(allVolunteers.map(v => v.groupMain))].filter(Boolean);
    const mainSelect = document.getElementById("mainGroupFilter");
    
    mainSelect.innerHTML = '<option value="">-- 所有大組 --</option>' + 
      mainGroups.map(g => `<option value="${g}" ${g === currentMain ? 'selected' : ''}>${g}</option>`).join('');
      
    filterSubGroups(true); // 傳入 true 表示維持既有小組選取狀態
  }

  function filterSubGroups(keepSubSelection = false) {
    const selectedMain = document.getElementById("mainGroupFilter").value;
    const currentSub = document.getElementById("subGroupFilter").value;
    const subSelect = document.getElementById("subGroupFilter");
    
    let subGroups = allVolunteers;
    if (selectedMain) {
      subGroups = subGroups.filter(v => v.groupMain === selectedMain);
    }
    const subGroupNames = [...new Set(subGroups.map(v => v.groupSub))].filter(Boolean);
    
    const targetSub = keepSubSelection ? currentSub : '';
    subSelect.innerHTML = '<option value="">-- 所有小組 --</option>' + 
      subGroupNames.map(g => `<option value="${g}" ${g === targetSub ? 'selected' : ''}>${g}</option>`).join('');
    
    renderList();
  }

  function renderList() {
    const date = document.getElementById("dateSelect").value;
    const search = document.getElementById("searchInput").value.trim().toLowerCase();
    const mainFilter = document.getElementById("mainGroupFilter").value;
    const subFilter = document.getElementById("subGroupFilter").value;

    const filtered = allVolunteers.filter(v => {
      const matchSearch = String(v.id).toLowerCase().includes(search) || 
                          v.name.toLowerCase().includes(search);
                          
      const matchMain = !mainFilter || v.groupMain === mainFilter;
      const matchSub = !subFilter || v.groupSub === subFilter;
      
      return matchSearch && matchMain && matchSub;
    });

    const tbody = document.getElementById("volunteerList");
    
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">查無符合條件的義工資料</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(v => {
      const isCheckIn = date === '8/22' ? v.checkIn822 === '已報到' : v.checkIn823 === '已報到';
      const currentMeal = date === '8/22' ? v.meal822 : v.meal823;

      return `
        <tr>
          <td><span class="badge bg-light text-dark border badge-id">${v.id}</span></td>
          <td class="fw-bold">${v.name}</td>
          <td><span class="badge bg-secondary me-1">${v.groupMain}</span><span class="text-muted small">${v.groupSub}</span></td>
          <td>
            <span class="badge ${isCheckIn ? 'bg-success' : 'bg-warning text-dark'}">
              ${isCheckIn ? '已報到' : '未報到'}
            </span>
          </td>
          <td>
            <select class="form-select form-select-sm" id="meal_${v.rowIndex}" onchange="updateMealLocal(${v.rowIndex}, this.value)">
              <option value="便當" ${currentMeal === '便當' ? 'selected' : ''}>便當</option>
              <option value="餐券" ${currentMeal === '餐券' ? 'selected' : ''}>餐券</option>
              <option value="不用餐" ${currentMeal === '不用餐' ? 'selected' : ''}>不用餐</option>
            </select>
          </td>
          <td class="text-center">
            <button class="btn btn-sm ${isCheckIn ? 'btn-outline-danger' : 'btn-primary'} px-3" 
                    onclick="handleCheckIn(${v.rowIndex}, ${!isCheckIn})">
              ${isCheckIn ? '取消報到' : '報到'}
            </button>
          </td>
        </tr>
      `;
    }).join('');
  }

  // 當用餐選單改變時，先更新記憶體
  function updateMealLocal(rowIndex, newMeal) {
    const date = document.getElementById("dateSelect").value;
    const item = allVolunteers.find(v => v.rowIndex === rowIndex);
    if (item) {
      if (date === '8/22') item.meal822 = newMeal;
      else item.meal823 = newMeal;
    }
  }

  // ⚡ 優化：即時局部更新，不重抓資料、保留搜尋與篩選狀態
  function handleCheckIn(rowIndex, checkInStatus) {
    const date = document.getElementById("dateSelect").value;
    const meal = document.getElementById(`meal_${rowIndex}`).value;

    // 1. 先即時更新本地記憶體中的狀態
    const item = allVolunteers.find(v => v.rowIndex === rowIndex);
    if (item) {
      if (date === '8/22') {
        item.checkIn822 = checkInStatus ? '已報到' : '未報到';
        item.meal822 = meal;
      } else {
        item.checkIn823 = checkInStatus ? '已報到' : '未報到';
        item.meal823 = meal;
      }
    }

    // 2. 立即重繪畫面（完全保留當前的搜尋條件與下拉選單狀態）
    renderList();

    // 3. 背景將資料發送到後端，不干擾使用者操作
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'checkIn',
        rowIndex: rowIndex,
        date: date,
        checkIn: checkInStatus,
        meal: meal
      })
    })
    .then(res => res.json())
    .then(res => {
      if(res.status !== 'success') {
        alert("背景同步失敗，請再試一次");
      }
    })
    .catch(err => alert("網路連線不穩定，狀態可能未寫回雲端"));
  }

  // ⚡ 優化：現場新增義工後保留目前篩選，並在本地加入新資料
  function submitNewVolunteer() {
    const date = document.getElementById("dateSelect").value;
    const name = document.getElementById("addName").value.trim();
    const groupMain = document.getElementById("addMainGroup").value.trim();
    const groupSub = document.getElementById("addSubGroup").value.trim();
    const meal = document.getElementById("addMeal").value;

    if(!name || !groupMain || !groupSub) {
      alert("請填寫所有必填欄位！");
      return;
    }

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'addVolunteer',
        name, groupMain, groupSub, meal, date
      })
    })
    .then(res => res.json())
    .then(res => {
      if(res.status === 'success') {
        alert(`新增成功！已自動給予序號：${res.id}`);
        
        // 算出試算表中的新 rowIndex
        const maxRowIndex = allVolunteers.length > 0 ? Math.max(...allVolunteers.map(v => v.rowIndex)) : 1;
        
        // 將新資料加入 local 記憶體
        allVolunteers.push({
          rowIndex: maxRowIndex + 1,
          id: res.id,
          name: name,
          groupMain: groupMain,
          groupSub: groupSub,
          checkIn822: date === '8/22' ? '已報到' : '未報到',
          meal822: date === '8/22' ? meal : '不用餐',
          checkIn823: date === '8/23' ? '已報到' : '未報到',
          meal823: date === '8/23' ? meal : '不用餐'
        });

        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        document.getElementById("addForm").reset();

        // 更新下拉選項並重繪（保持現有選擇狀態）
        setupGroupFilters();
      } else {
        alert("新增失敗：" + (res.message || "請重試"));
      }
    })
    .catch(err => alert("連線失敗，請檢查網路"));
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
